<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Meu Caixa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#F5F3FA;
  --card:#FFFFFF;
  --text:#2B2640;
  --text-dim:#948DB0;
  --ganho:#1FBE83;
  --ganho-soft:#E1FAEF;
  --gasto:#FF6B5E;
  --gasto-soft:#FFEAE7;
  --accent:#7C6CF7;
  --accent-soft:#EEEAFE;
  --gold:#FFB648;
  --gold-soft:#FFF3E0;
  --line:#EDEAF6;
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 10px 28px rgba(43,38,64,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:106px;}

header.topbar{padding:26px 20px 6px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{
  width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--ganho));
  display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--shadow);
}
.brand h1{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:20px;margin:0;color:var(--text);}
.brand .eyebrow{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:1px;}
.logout-btn{background:var(--card);border:none;border-radius:50%;width:36px;height:36px;box-shadow:var(--shadow);font-size:15px;color:var(--text-dim);}

main{padding:14px 20px 10px;}

/* Balance hero card */
.hero{
  border-radius:28px;padding:24px 22px 20px;position:relative;overflow:hidden;
  background:linear-gradient(135deg, var(--accent-soft) 0%, var(--ganho-soft) 100%);
  box-shadow:var(--shadow);
}
.hero::after{
  content:'';position:absolute;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.35);top:-90px;right:-60px;
}
.hero-top{display:flex;align-items:center;gap:8px;position:relative;z-index:1;}
.hero-badge{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 10px rgba(43,38,64,.08);}
.hero-label{font-size:12.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
.hero-amount{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:42px;margin-top:8px;position:relative;z-index:1;color:var(--text);}
.hero-amount.neg{color:var(--gasto);}
.hero-note{font-size:13px;color:var(--text-dim);font-weight:600;margin-top:2px;position:relative;z-index:1;}
.hero-stats{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1;}
.hero-stat{flex:1;background:rgba(255,255,255,.65);border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:9px;}
.hero-stat .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.hero-stat.g .ic{background:var(--ganho-soft);}
.hero-stat.d .ic{background:var(--gasto-soft);}
.hero-stat .txt{min-width:0;}
.hero-stat .k{font-size:10.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;}
.hero-stat .v{font-family:'Baloo 2';font-weight:700;font-size:16px;}
.hero-stat.g .v{color:var(--ganho);}
.hero-stat.d .v{color:var(--gasto);}

.section-title{font-family:'Baloo 2';font-weight:700;font-size:15.5px;color:var(--text);margin:24px 2px 10px;display:flex;align-items:center;justify-content:space-between;}
.pill-btn{font-family:'Plus Jakarta Sans';font-weight:700;font-size:12px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;}

.card{background:var(--card);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);}

.tx-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
.tx-row:last-child{border-bottom:none;}
.tx-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.tx-ic.g{background:var(--ganho-soft);}
.tx-ic.d{background:var(--gasto-soft);}
.tx-mid{flex:1;min-width:0;}
.tx-desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-date{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:1px;}
.tx-amt{font-family:'Baloo 2';font-weight:700;font-size:15px;white-space:nowrap;}
.tx-amt.g{color:var(--ganho);}
.tx-amt.d{color:var(--gasto);}
.tx-del{background:none;border:none;color:var(--text-dim);font-size:18px;padding:0 0 0 8px;line-height:1;}
.tx-actions{display:flex;align-items:center;gap:0;}
.tx-edit{background:none;border:none;color:var(--accent);font-size:14px;padding:0 0 0 8px;line-height:1;}
.empty-note{color:var(--text-dim);font-size:13.5px;font-weight:600;text-align:center;padding:22px 6px;}

/* Forms */
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;}
.field input{
  width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;
  padding:12px 13px;color:var(--text);font-family:'Plus Jakarta Sans';font-weight:600;font-size:15.5px;
}
.field input:focus{outline:none;border-color:var(--accent);}
.field-err{color:var(--gasto);font-size:12px;font-weight:600;margin-top:6px;min-height:0;}
.seg{display:flex;gap:8px;border-radius:16px;margin-bottom:15px;}
.seg button{flex:1;padding:12px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text-dim);font-family:'Baloo 2';font-weight:700;font-size:14px;}
.seg button.active.ganho{background:var(--ganho-soft);border-color:var(--ganho);color:var(--ganho);}
.seg button.active.gasto{background:var(--gasto-soft);border-color:var(--gasto);color:var(--gasto);}
.btn-primary{
  width:100%;padding:14px 0;border-radius:16px;border:none;
  background:linear-gradient(135deg,var(--accent),#9B8CFF);color:#fff;font-family:'Baloo 2';font-weight:700;
  font-size:15px;box-shadow:0 8px 18px rgba(124,108,247,.32);
}
.btn-primary:disabled{opacity:.6;}
.btn-ghost{width:100%;padding:12px 0;border-radius:14px;border:2px solid var(--line);background:none;color:var(--text-dim);font-family:'Plus Jakarta Sans';font-weight:700;font-size:13px;margin-top:8px;}

.bar-track{height:10px;border-radius:20px;background:var(--line);overflow:hidden;margin-top:10px;}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--ganho),#5FE3B3);}
.bar-fill.amber{background:linear-gradient(90deg,var(--gold),#FFCB80);}

.goal-card{margin-bottom:12px;}
.goal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.goal-week{font-family:'Baloo 2';font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.goal-week .ic{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:14px;}
.goal-nums{display:flex;justify-content:space-between;margin-top:11px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.goal-nums b{color:var(--text);}
.goal-nums.two{margin-top:6px;}
.goal-actions{display:flex;align-items:center;gap:2px;}
.goal-edit{background:none;border:none;color:var(--accent);font-size:14px;padding:0 6px;line-height:1;}

/* Day picker (dias de trabalho) */
.day-picker{display:flex;flex-wrap:wrap;gap:6px;}
.day-chip{flex:1;min-width:38px;padding:9px 0;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text-dim);font-family:'Plus Jakarta Sans';font-weight:700;font-size:12px;}
.day-chip.active{background:var(--gold-soft);border-color:var(--gold);color:#B5760A;}
.goal-days{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;}
.day-badge{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--line);color:var(--text-dim);}
.day-badge.on{background:var(--gold-soft);color:#B5760A;}

/* Divisão semanal da meta */
.wk-title{font-family:'Baloo 2';font-weight:700;font-size:13px;color:var(--text);margin:16px 0 6px;}
.wk-row{padding:10px 12px;border-radius:14px;background:var(--bg);margin-bottom:8px;}
.wk-row.cur{background:var(--gold-soft);}
.wk-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;}
.wk-days{font-size:11px;color:var(--text-dim);font-weight:700;}
.hero-stat.m .ic{background:var(--gold-soft);}
.hero-stat.m .v{color:#B5760A;}

/* Week summary (painel) */
.week-summary{display:flex;align-items:stretch;}
.week-summary-item{flex:1;}
.week-summary-item .k{font-size:10.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.week-summary-item .v{font-family:'Baloo 2';font-weight:800;font-size:20px;margin-top:4px;}
.week-summary-item .v.g{color:var(--ganho);}
.week-summary-item .v.d{color:var(--gasto);}
.week-summary-divider{width:1px;background:var(--line);margin:0 14px;}
.daily-status{margin-top:12px;font-size:13px;font-weight:700;padding:10px 12px;border-radius:14px;}
.daily-status.hit{background:var(--ganho-soft);color:var(--ganho);}
.daily-status.pending{background:var(--gold-soft);color:#B5760A;}
.daily-status.off{background:var(--line);color:var(--text-dim);}

/* Ano tab */
.year-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.year-nav button{background:var(--card);border:none;color:var(--text);border-radius:50%;width:38px;height:38px;font-size:17px;box-shadow:var(--shadow);font-weight:700;}
.year-nav .yr{font-family:'Baloo 2';font-weight:800;font-size:22px;}
.month-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.month-row:last-child{border-bottom:none;}
.month-name{width:36px;font-weight:700;font-size:12px;color:var(--text-dim);flex-shrink:0;}
.month-bars{flex:1;display:flex;flex-direction:column;gap:5px;}
.mb-row{display:flex;align-items:center;gap:7px;}
.mb-track{flex:1;height:8px;border-radius:10px;background:var(--line);overflow:hidden;}
.mb-fill{height:100%;border-radius:10px;}
.mb-val{font-size:11px;font-weight:700;width:62px;text-align:right;flex-shrink:0;}

/* Bottom nav */
.navbar{
  position:fixed;left:0;right:0;bottom:14px;max-width:440px;margin:0 auto;
  display:flex;gap:4px;background:var(--card);border-radius:24px;padding:8px;
  box-shadow:0 12px 30px rgba(43,38,64,.16);
}
.navkey{flex:1;padding:9px 2px;border:none;background:transparent;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Plus Jakarta Sans';}
.navkey .ic{font-size:19px;}
.navkey .label{font-size:10.5px;font-weight:700;color:var(--text-dim);}
.navkey.active{background:var(--tabcolor-soft);}
.navkey.active .label{color:var(--tabcolor);}

.toast{
  position:fixed;left:50%;bottom:118px;transform:translateX(-50%);
  background:var(--text);color:#fff;font-weight:600;
  font-size:12.5px;padding:10px 18px;border-radius:20px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
}
.toast.show{opacity:1;}

/* Auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{max-width:380px;width:100%;}
.auth-logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--ganho));
  display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:var(--shadow);margin:0 auto 14px;}
.auth-title{font-family:'Baloo 2';font-weight:800;font-size:24px;text-align:center;margin-bottom:2px;}
.auth-sub{font-size:13px;color:var(--text-dim);font-weight:600;text-align:center;margin-bottom:22px;}
.auth-tabs{display:flex;gap:8px;background:var(--card);border-radius:16px;padding:6px;margin-bottom:18px;box-shadow:var(--shadow);}
.auth-tabs button{flex:1;padding:10px 0;border:none;border-radius:12px;background:transparent;color:var(--text-dim);font-family:'Baloo 2';font-weight:700;font-size:13.5px;}
.auth-tabs button.active{background:var(--accent-soft);color:var(--accent);}
</style>

<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================================================================
// CONFIGURAÇÃO DO SUPABASE — troque pelos dados do SEU projeto
// (Project Settings -> API, no painel do Supabase)
// =====================================================================
// ATENÇÃO: a meta MENSAL é guardada na tabela weekly_goals, com week_start = dia 1 do mês.
// A coluna work_days precisa existir (se ainda não rodou, execute uma vez no SQL Editor):
//   ALTER TABLE weekly_goals ADD COLUMN IF NOT EXISTS work_days int[] DEFAULT '{}'::int[];
const SUPABASE_URL = 'https://kpgsglrqmoprredxcabf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwZ3NnbHJxbW9wcnJlZHhjYWJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODg1ODcsImV4cCI6MjEwMzM2NDU4N30.8Wf6zqf2s8_mUbrMiSKCx2FDIqcd9iOKRAFxe3145NU';

const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const MESES_LONGO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
// offset 0 = segunda-feira (weekStart) ... 6 = domingo
const DIAS_SEMANA = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

const TAB_COLORS = {
  painel: {color:'#7C6CF7', soft:'#EEEAFE'},
  lancar: {color:'#1FBE83', soft:'#E1FAEF'},
  metas:  {color:'#FFB648', soft:'#FFF3E0'},
  ano:    {color:'#FF6B5E', soft:'#FFEAE7'}
};

let state = {
  tab: 'painel',
  transactions: [],
  goals: [],            // metas mensais: { id, ym:'YYYY-MM', amount, workDays:[0..6] }
  year: new Date().getFullYear(),
  loading: true,
  showGoalForm: false,
  editingGoalId: null,
  goalFormDays: [],
  editingTxId: null,
  session: null,
  authMode: 'login',   // 'login' | 'cadastro'
  authBusy: false,
  authError: ''
};

// ---------- helpers ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad2(n){ return String(n).padStart(2,'0'); }
function localISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return localISO(new Date()); }
function parseD(s){ return new Date(s+'T00:00:00'); }
function formatBRL(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function formatDateBR(d){ const [y,m,day]=d.split('-'); return `${day}/${m}`; }
function getMonday(dateStr){
  const d = parseD(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day));
  return localISO(d);
}
function addDays(dateStr,n){
  const d = parseD(dateStr);
  d.setDate(d.getDate()+n);
  return localISO(d);
}
function dayOffset(weekStart, dateStr){
  return Math.round((parseD(dateStr)-parseD(weekStart))/86400000);
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return `${MESES_LONGO[m-1]} ${y}`;
}

// ---------- ganhos ----------
function ganhoBetween(from,to){
  return state.transactions.filter(t=>t.date>=from && t.date<=to).reduce((s,t)=>s+t.amount,0);
}
function monthGanho(ym){
  return state.transactions.filter(t=>t.date.slice(0,7)===ym).reduce((s,t)=>s+t.amount,0);
}
function todayGanho(){
  const today = todayStr();
  return state.transactions.filter(t=>t.date===today).reduce((s,t)=>s+t.amount,0);
}

// ---------- metas (mensal -> semanas -> dias) ----------
function goalForMonth(ym){ return state.goals.find(g=>g.ym===ym); }

// Semanas (seg–dom) que tocam o mês; conta quantos dias de trabalho caem em cada uma, dentro do mês
function monthWeeks(ym, workDays){
  const [y,m] = ym.split('-').map(Number);
  const first = `${ym}-01`;
  const last = localISO(new Date(y, m, 0));
  const weeks = [];
  let ws = getMonday(first);
  while(ws <= last){
    const wEnd = addDays(ws,6);
    let days = 0;
    for(let i=0;i<7;i++){
      const d = addDays(ws,i);
      if(d>=first && d<=last && workDays.includes(i)) days++;
    }
    weeks.push({ ws, from: ws<first?first:ws, to: wEnd>last?last:wEnd, days });
    ws = addDays(ws,7);
  }
  return weeks;
}
// Meta do mês ÷ total de dias de trabalho = valor diário; cada semana = valor diário × dias da semana
function goalPlan(goal){
  const workDays = goal.workDays || [];
  const weeks = monthWeeks(goal.ym, workDays).filter(w=>w.days>0);
  const totalDays = weeks.reduce((s,w)=>s+w.days,0);
  const daily = totalDays>0 ? goal.amount/totalDays : 0;
  weeks.forEach(w=>{ w.target = daily*w.days; w.actual = ganhoBetween(w.from,w.to); });
  return { weeks, totalDays, daily };
}

// ---------- Supabase: auth ----------
async function initAuth(){
  const { data: { session } } = await supa.auth.getSession();
  state.session = session;
  supa.auth.onAuthStateChange((_event, session)=>{
    state.session = session;
    if(session){ loadAll(); }
    else{
      state.transactions = [];
      state.goals = [];
      state.loading = false;
      render();
    }
  });
  if(session){ await loadAll(); }
  else{ state.loading = false; render(); }
}

function setAuthMode(mode){ state.authMode = mode; state.authError=''; render(); }

async function submitAuth(ev){
  ev.preventDefault();
  const form = ev.target;
  const email = form.email.value.trim();
  const password = form.password.value;
  if(!email || !password){ state.authError='Preencha e-mail e senha'; render(); return; }
  if(password.length<6){ state.authError='A senha precisa ter ao menos 6 caracteres'; render(); return; }
  state.authBusy = true; state.authError=''; render();
  try{
    if(state.authMode==='cadastro'){
      const { error } = await supa.auth.signUp({ email, password });
      if(error) throw error;
      showToast('✅ Conta criada! Verifique seu e-mail se a confirmação estiver ativa.');
    }else{
      const { error } = await supa.auth.signInWithPassword({ email, password });
      if(error) throw error;
      showToast('👋 Bem-vindo de volta!');
    }
  }catch(e){
    state.authError = traduzErroAuth(e.message);
  }finally{
    state.authBusy = false; render();
  }
}
function traduzErroAuth(msg){
  if(!msg) return 'Não foi possível continuar. Tente novamente.';
  if(/invalid login credentials/i.test(msg)) return 'E-mail ou senha inválidos.';
  if(/already registered|user already exists/i.test(msg)) return 'Este e-mail já está cadastrado.';
  if(/password/i.test(msg) && /6/.test(msg)) return 'A senha precisa ter ao menos 6 caracteres.';
  return msg;
}
async function logout(){
  await supa.auth.signOut();
  showToast('Até logo! 👋');
}

// ---------- Supabase: dados ----------
async function loadAll(){
  state.loading = true; render();
  try{
    const [{data:tx, error:e1}, {data:goals, error:e2}] = await Promise.all([
      supa.from('transactions').select('*').order('date',{ascending:false}),
      supa.from('weekly_goals').select('*')
    ]);
    if(e1) throw e1;
    if(e2) throw e2;
    // só ganhos (lançamentos antigos de gasto são ignorados)
    state.transactions = (tx||[]).filter(r=>r.type==='ganho')
      .map(r=>({ id:r.id, type:'ganho', amount:Number(r.amount), desc:r.description || '', date:r.date }));
    // metas mensais ficam guardadas com week_start = dia 1 do mês (metas semanais antigas são ignoradas)
    state.goals = (goals||[]).filter(r=>String(r.week_start).slice(8,10)==='01')
      .map(r=>({ id:r.id, ym:String(r.week_start).slice(0,7), amount:Number(r.amount), workDays:r.work_days||[] }))
      .sort((a,b)=>a.ym<b.ym?-1:1);
  }catch(e){
    showToast('Erro ao carregar dados');
  }
  state.loading = false;
  render();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

// ---------- actions ----------
function setTab(tab){ state.tab = tab; render(); }

async function submitTransaction(ev){
  ev.preventDefault();
  const form = ev.target;
  const amount = parseFloat(form.amount.value.replace(',','.'));
  const desc = form.desc.value.trim();
  const date = form.date.value || todayStr();
  if(!amount || amount<=0){ showToast('Informe um valor válido'); return; }
  const userId = state.session.user.id;

  if(state.editingTxId){
    const payload = { type:'ganho', amount, description: desc || 'Ganho', date };
    const { data, error } = await supa.from('transactions')
      .update(payload)
      .eq('id', state.editingTxId)
      .select().single();
    if(error){ showToast('Erro ao atualizar lançamento'); return; }
    const t = state.transactions.find(x=>x.id===state.editingTxId);
    if(t){ t.amount=Number(data.amount); t.desc=data.description; t.date=data.date; }
    showToast('✅ Lançamento atualizado');
    state.editingTxId = null;
  } else {
    const payload = { type:'ganho', amount, description: desc || 'Ganho', date, user_id: userId };
    const { data, error } = await supa.from('transactions').insert(payload).select().single();
    if(error){ showToast('Erro ao salvar lançamento'); return; }
    state.transactions.unshift({ id:data.id, type:'ganho', amount:Number(data.amount), desc:data.description, date:data.date });
    showToast('✅ Ganho registrado');
  }
  form.reset();
  render();
}
function editTransaction(id){
  const t = state.transactions.find(x=>x.id===id);
  if(!t) return;
  state.editingTxId = id;
  state.tab = 'lancar';
  render();
}
function cancelTxEdit(){
  state.editingTxId = null;
  render();
}
async function deleteTransaction(id){
  const prev = state.transactions;
  state.transactions = state.transactions.filter(t=>t.id!==id);
  if(state.editingTxId===id) state.editingTxId = null;
  render();
  const { error } = await supa.from('transactions').delete().eq('id', id);
  if(error){ state.transactions = prev; showToast('Erro ao excluir'); render(); }
}

function toggleGoalForm(){
  state.showGoalForm = !state.showGoalForm;
  if(state.showGoalForm && !state.editingGoalId){
    // sugere os mesmos dias da meta do mês atual, se existir
    const cur = goalForMonth(todayStr().slice(0,7));
    state.goalFormDays = cur ? [...cur.workDays] : [];
  }
  if(!state.showGoalForm){ state.editingGoalId = null; state.goalFormDays = []; }
  render();
}
function editGoal(id){
  const g = state.goals.find(x=>x.id===id);
  state.editingGoalId = id;
  state.goalFormDays = g && g.workDays ? [...g.workDays] : [];
  state.showGoalForm = true;
  render();
}
function cancelGoalForm(){
  state.showGoalForm = false;
  state.editingGoalId = null;
  state.goalFormDays = [];
  render();
}
function toggleGoalDay(offset){
  const idx = state.goalFormDays.indexOf(offset);
  if(idx>=0) state.goalFormDays.splice(idx,1);
  else state.goalFormDays.push(offset);
  state.goalFormDays.sort((a,b)=>a-b);
  render();
}
async function submitGoal(ev){
  ev.preventDefault();
  const form = ev.target;
  const ym = form.refMonth.value || todayStr().slice(0,7);
  const amount = parseFloat(form.amount.value.replace(',','.'));
  if(!amount || amount<=0){ showToast('Informe um valor válido'); return; }
  if(state.goalFormDays.length===0){ showToast('Selecione ao menos um dia de trabalho'); return; }
  const weekStart = `${ym}-01`;   // meta mensal guardada no dia 1 do mês
  const workDays = [...state.goalFormDays];
  const userId = state.session.user.id;

  if(state.editingGoalId){
    const { data, error } = await supa.from('weekly_goals')
      .update({ week_start:weekStart, amount, work_days:workDays })
      .eq('id', state.editingGoalId)
      .select().single();
    if(error){ showToast('Erro ao atualizar meta (já existe outra meta nesse mês?)'); return; }
    const g = state.goals.find(x=>x.id===state.editingGoalId);
    if(g){ g.ym = String(data.week_start).slice(0,7); g.amount = Number(data.amount); g.workDays = data.work_days||[]; }
    showToast('🎯 Meta atualizada');
  } else {
    // uma meta por mês; se já existir, ela é atualizada
    const { data, error } = await supa.from('weekly_goals')
      .upsert({ user_id:userId, week_start:weekStart, amount, work_days:workDays }, { onConflict:'user_id,week_start' })
      .select().single();
    if(error){ showToast('Erro ao salvar meta'); return; }
    const existing = state.goals.find(g=>g.ym===ym);
    if(existing){ existing.amount = Number(data.amount); existing.id = data.id; existing.workDays = data.work_days||[]; }
    else{ state.goals.push({ id:data.id, ym, amount:Number(data.amount), workDays:data.work_days||[] }); }
    showToast('🎯 Meta salva');
  }
  state.goals.sort((a,b)=>a.ym<b.ym?-1:1);
  state.showGoalForm = false;
  state.editingGoalId = null;
  state.goalFormDays = [];
  render();
}
async function deleteGoal(id){
  const prev = state.goals;
  state.goals = state.goals.filter(g=>g.id!==id);
  if(state.editingGoalId===id){ state.editingGoalId = null; state.showGoalForm = false; }
  render();
  const { error } = await supa.from('weekly_goals').delete().eq('id', id);
  if(error){ state.goals = prev; showToast('Erro ao excluir meta'); render(); }
}
function changeYear(delta){ state.year += delta; render(); }

function weekSummaryCardHtml(){
  const today = todayStr();
  const ym = today.slice(0,7);
  const weekStart = getMonday(today);
  const wEnd = addDays(weekStart,6);
  const goal = goalForMonth(ym);
  const week = goal ? goalPlan(goal).weeks.find(w=>w.ws===weekStart) : null;
  const gWeek = week ? week.actual : ganhoBetween(weekStart,wEnd);
  const meta = week ? week.target : 0;
  const falta = Math.max(0, meta-gWeek);
  return `
  <div class="section-title">Esta semana<span class="pill-btn" style="background:none;color:var(--text-dim);font-weight:700;">${formatDateBR(weekStart)} – ${formatDateBR(wEnd)}</span></div>

    <div class="week-summary-item">
      <div class="k">Meta da semana</div>
      <div class="v">${week ? formatBRL(meta) : '—'}</div>
    </div>
    <div class="week-summary-divider"></div>
    <div class="week-summary-item">
      <div class="k">Falta</div>
      <div class="v" style="color:var(--gold)">${week ? formatBRL(falta) : '—'}</div>

}

function dailyGoalCardHtml(){
  const today = todayStr();
  const goal = goalForMonth(today.slice(0,7));

  if(!goal){
    return `<div class="section-title">Meta diária</div>
    <div class="card"><div class="empty-note">Defina sua meta mensal na aba <b>Metas</b> para ver quanto precisa fazer por dia 🎯</div></div>`;
  }
  const workDays = goal.workDays || [];
  if(workDays.length===0){
    return `<div class="section-title">Meta diária</div>
    <div class="card"><div class="empty-note">Escolha os dias de trabalho na aba <b>Metas</b> para calcular o valor diário 📅</div></div>`;
  }

  const { daily, totalDays } = goalPlan(goal);
  const offset = dayOffset(getMonday(today), today);
  const isWorkToday = workDays.includes(offset);
  const ganhoHoje = todayGanho();
  const pct = daily>0 ? Math.min(100, Math.round((ganhoHoje/daily)*100)) : 0;
  const bateu = ganhoHoje >= daily;

  let statusClass, statusMsg;
  if(!isWorkToday){
    statusClass = 'off'; statusMsg = '😴 Hoje não é dia de trabalho nesta meta';
  } else if(bateu){
    statusClass = 'hit'; statusMsg = '🎉 Meta de hoje batida!';
  } else {
    statusClass = 'pending'; statusMsg = `Faltam ${formatBRL(Math.max(0,daily-ganhoHoje))} para bater a meta de hoje`;
  }

  return `
  <div class="section-title">Meta diária</div>
  <div class="card">
    <div class="goal-nums" style="margin-top:0;">
      <span>Preciso fazer por dia (÷${totalDays}d no mês)</span><b>${formatBRL(daily)}</b>
    </div>
    ${isWorkToday ? `
    <div class="bar-track"><div class="bar-fill ${bateu?'':'amber'}" style="width:${pct}%"></div></div>
    <div class="goal-nums"><span>Ganho hoje</span><b style="color:var(--ganho)">${formatBRL(ganhoHoje)}</b></div>` : ''}
    <div class="daily-status ${statusClass}">${statusMsg}</div>
  </div>`;
}

  const falta = Math.max(0, goal.amount-actual);
  const pct = goal.amount>0 ? Math.min(100, Math.round((actual/goal.amount)*100)) : 0;
  const currentWeek = getMonday(todayStr());

  return `
  <div class="card goal-card">
    <div class="goal-head">
      <span class="goal-week"><span class="ic">🎯</span> ${monthLabel(goal.ym)}</span>
      <span class="goal-actions">
        <button class="goal-edit" onclick="editGoal('${goal.id}')" aria-label="Editar meta">✏️</button>
        <button class="tx-del" onclick="deleteGoal('${goal.id}')" aria-label="Excluir meta">×</button>

    <div class="goal-nums">
      <span>Meta: <b>${formatBRL(goal.amount)}</b></span>
      <span>Ganho: <b style="color:var(--ganho)">${formatBRL(actual)}</b></span>
    </div>
    <div class="goal-nums two">
      <span>${pct}% da meta</span>
      <span>Falta: <b style="color:var(--gold)">${formatBRL(falta)}</b></span>
    </div>
    <div class="goal-days">
      ${DIAS_SEMANA.map((d,i)=>`<span class="day-badge ${workDays.includes(i)?'on':''}">${d}</span>`).join('')}
    </div>
    <div class="goal-nums two" style="margin-top:8px;">
      <span>Meta diária (÷${totalDays}d no mês)</span><b>${formatBRL(daily)}</b>
    </div>
    <div class="wk-title">Divisão por semana (${weeks.length})</div>
    ${weeks.map((w,i)=>{
      const wp = w.target>0 ? Math.min(100, Math.round((w.actual/w.target)*100)) : 0;
      const isCur = w.ws===currentWeek;
      return `
      <div class="wk-row ${isCur?'cur':''}">

          <span class="wk-name">Sem ${i+1} · ${formatDateBR(w.from)}–${formatDateBR(w.to)}${isCur?' · atual':''}</span>

        </div>
      </div>`;
    }).join('')}
  </div>`;
}

    const goal = goalForMonth(ym);
    maxVal = Math.max(maxVal, ganho);

  const yearGanho = rows.reduce((s,r)=>s+r.ganho,0);

  return `

    <button onclick="changeYear(-1)">‹</button>
    <span class="yr">${year}</span>
    <button onclick="changeYear(1)">›</button>

  <div class="hero" style="margin-bottom:18px;">

      <div class="hero-label">Ganhos do ano</div>

    <div class="hero-amount" style="font-size:34px;">${formatBRL(yearGanho)}</div>

  <div class="section-title">Por mês</div>
  <div class="card">
    ${rows.map(r=>`
      <div class="month-row">

        <div class="month-bars">
          <div class="mb-row">
            <div class="mb-track"><div class="mb-fill" style="width:${(r.ganho/maxVal)*100}%;background:var(--ganho);"></div></div>
            <div class="mb-val" style="color:var(--ganho)">${formatBRL(r.ganho)}</div>
          </div>
          ${r.meta>0 ? `<div class="mb-row">
            <div class="mb-track"><div class="mb-fill" style="width:${Math.min(100,(r.meta/maxVal)*100)}%;background:var(--gold);"></div></div>
            <div class="mb-val" style="color:#B5760A">${formatBRL(r.meta)}</div>
          </div>` : ''}
        </div>
      </div>`).join('')}
  </div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- main render ----------
function render(){
  const app = document.getElementById('app');

  if(state.loading){
    app.innerHTML = `<div class="auth-wrap"><div class="auth-box"><div class="auth-logo">🐷</div><div class="auth-title">Meu Caixa</div><div class="auth-sub">Carregando...</div></div></div>`;
    return;
  }

  if(!state.session){
    app.innerHTML = renderAuth();
    return;
  }

  let body = '';
  if(state.tab==='painel') body = renderPainel();
  else if(state.tab==='lancar') body = renderLancar();
  else if(state.tab==='metas') body = renderMetas();
  else if(state.tab==='ano') body = renderAno();

  app.innerHTML = `${renderHeader()}<main>${body}</main>${renderNavbar()}`;
}

initAuth();
</script>
</body>
</html>
